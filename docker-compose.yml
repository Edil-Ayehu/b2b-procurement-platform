services:
  postgres:
    image: postgres:16
    container_name: b2b-procurement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement_password
      POSTGRES_DB: procurement_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: